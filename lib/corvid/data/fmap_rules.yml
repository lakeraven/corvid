# Statutory FMAP rules as data (#546). Effective/expiration dates make
# every rule reproducible by date of service; a statutory change is a
# data update here, not a code release. A rule with no effective_on is
# dormant: present as data, never in force until enactment sets a date.
#
# Citations are the load-bearing field — every classification a findings
# packet reports resolves back to these strings.

- rule_key: us-ihs-638-100
  jurisdiction: US
  category: fmap_100_ihs_638
  fmap_percent: 100.0
  statutory_citation: "SSA 1905(b) (third sentence); 42 CFR 433.10"
  facility_authority_types: [ihs_direct, contract_638, compact_638]
  received_through_bases: [facility_authority]
  requires_aian: true
  requires_received_through: true
  effective_on: 1976-10-01
  notes: >
    100 percent federal match for services received through an IHS or
    tribal 638 facility by AI/AN Medicaid beneficiaries.

- rule_key: us-cca-100
  jurisdiction: US
  category: fmap_100_cca
  fmap_percent: 100.0
  statutory_citation: "SSA 1905(b); CMS SHO #16-002 (2016-02-26)"
  received_through_bases: [cca]
  requires_aian: true
  requires_received_through: true
  effective_on: 2016-02-26
  notes: >
    Services furnished by non-IHS/tribal providers are "received through"
    an IHS/638 facility when furnished under a written care coordination
    agreement whose scope covers the service and date.

