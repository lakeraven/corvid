# Canned 999 / 277CA acknowledgments for the fixture clearinghouse client.
#
# These are REJECTIONS — front-door refusals, never adjudicated, never
# appealable. The only correct response is fix-and-resubmit. Keyed by claim
# identifier so a scenario is reproduced by submitting the same claim id.
#
# delayed_rejection: accepted at the front door, rejected later by the payer.
# The clearinghouse takes the claim, so `submit_claim` returns accepted unless
# a front-door rule (such as a missing billing provider NPI) rejects it. That
# front-door rejection is also the later acknowledgment. Otherwise the payer's
# 277CA is what `fetch_acknowledgments` returns. Any claim listed here must
# have at least one edit with a non-blank code and description, or submit
# raises and records nothing. Rejection keys must be strings.
default_outcome: accepted
default_transaction_set: "277CA"

rejections:
  CLM-RJ-0001:
    transaction_set: "277CA"
    edits:
      - code: "A7:562"
        description: "Entity's National Provider Identifier (NPI) — the billing provider NPI is not on file with this payer."
        element: "NM1*85 billing provider"
        level: claim
  CLM-RJ-0002:
    transaction_set: "999"
    edits:
      - code: "IK403:I12"
        description: "Implementation pattern match failure — the subscriber member identifier is not in a format this payer accepts."
        element: "NM1*IL*09 subscriber member id"
        level: segment
  CLM-RJ-0003:
    transaction_set: "277CA"
    edits:
      - code: "A3:21"
        description: "Missing or invalid information — the diagnosis code pointed to by the service line is not a billable code."
        element: "HI*ABK diagnosis"
        level: claim
      - code: "A3:249"
        description: "Missing or invalid information — the place of service code conflicts with the submitted modifier."
        element: "SV105 place of service"
        level: line
  CLM-RJ-DELAYED-0001:
    delayed_rejection: true
    transaction_set: "277CA"
    edits:
      - code: "SYN:277CA"
        description: "Payer-level claim acknowledgment — the claim was refused on a later 277CA after the clearinghouse accepted it."
        element: "STC claim status"
        level: claim
