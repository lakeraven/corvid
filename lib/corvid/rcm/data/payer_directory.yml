      eligibility:
        supported: true
        enrollment_required: false
      claim_status:
        supported: false
        enrollment_required: false
      coverage_discovery:
        supported: false
        enrollment_required: false
      coordination_of_benefits:
        supported: false
        enrollment_required: false
      paper_claim:
        supported: false
        enrollment_required: false

  # Paper claims only. No electronic claim type is supported.
  - payer_identifier: EXPAPER01
    aliases: []
    name: EXAMPLE PAPER ONLY PAYER
    as_of: 2026-01-01
    transactions:
      professional_claim:
        supported: false
        enrollment_required: false
      institutional_claim:
        supported: false
