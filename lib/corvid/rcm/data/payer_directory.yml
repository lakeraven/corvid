# Synthetic payer directory for the fixture clearinghouse client.
# These payers are invented: not real organizations, and not real payer IDs.
payers:
  # Every transaction is supported, and none of them require enrollment.
  - payer_identifier: EXCOMM01
    aliases:
      - EXCOMM-ALT
    name: EXAMPLE COMMERCIAL PAYER
    as_of: 2026-01-01
    transactions:
      professional_claim:
        supported: true
        enrollment_required: false
      institutional_claim:
        supported: true
        enrollment_required: false
      dental_claim:
        supported: true
        enrollment_required: false
      remittance:
        supported: true
        enrollment_required: false
      eligibility:
        supported: true
        enrollment_required: false
      claim_status:
        supported: true
        enrollment_required: false
      coverage_discovery:
        supported: true
        enrollment_required: false
      coordination_of_benefits:
        supported: true
        enrollment_required: false
      paper_claim:
        supported: true
        enrollment_required: false

  # Professional claims and eligibility. Remittance requires enrollment.
  # Dental is not supported.
  - payer_identifier: EXMCD01
