# Known plaintext columns in corvid_* tables, with a remediation date.
#
# WHY THIS FILE EXISTS. ADR 0003 states that no corvid_* table holds PHI and
# that a corvid database dump must reveal none. That was not true of the schema
# when this file was written. A disclosed, dated exception list is more useful
# to anyone evaluating the claim than an adjective, and it is what lets
# test/corvid/phi_schema_guard_test.rb fail hard on anything NEW while the
# existing surface is worked down.
#
# `classification` is the field that needs a human:
#
#   patient_phi      - patient-linked. Remediate (tokenize, encrypt, or drop).
#   needs_decision   - genuinely ambiguous; a legal call, not an engineering one.
#   false_positive   - matched a name pattern but is not patient data. The fix is
#                      to allowlist it in the guard, NOT to remediate it. Left
#                      here rather than silently allowlisted, because widening
#                      the allowlist makes the guard weaker and that should be a
#                      deliberate, reviewed act.
#
# Entries are NOT ranked by severity. corvid_prc_obligations.patient_dfn is a
# plaintext medical record number and is the one to fix first.

- table: corvid_prc_obligations
  column: patient_dfn
  classification: patient_phi
  why: "Direct patient identifier (RPMS DFN = MRN). 45 CFR 164.514(b)(2)(i)(H). The most consequential entry in this file."
  remediate_by: "2026-10-20"
- table: corvid_prc_obligations
  column: service_date
  classification: patient_phi
  why: "Date of service for an individual. (C)."
  remediate_by: "2026-10-20"
- table: corvid_alternate_resource_checks
  column: coverage_start
  classification: patient_phi
  why: "An individual's coverage dates. (C)."
  remediate_by: "2026-10-20"
- table: corvid_alternate_resource_checks
  column: coverage_end
  classification: patient_phi
  why: "An individual's coverage dates. (C)."
  remediate_by: "2026-10-20"
- table: corvid_alternate_resource_checks
  column: group_number
