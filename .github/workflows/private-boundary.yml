name: private-boundary
# Fails a PR if a private-boundary term (partner / tribe / vendor names, etc.)
# appears in this public repo — in tracked files OR in the PR title/body.
# The blocklist lives ONLY in the encrypted `LAKERAVEN_BOUNDARY_BLOCKLIST`
# secret (newline-delimited, case-insensitive), never in the repo, and matched
# terms are never echoed — only file:line — so the blocklist cannot leak
# through public CI logs. Terms match on word boundaries that also treat "_"
# as a boundary (so tnt_<term> and <term>_x are caught), which plain `grep -w`
# would miss. If the secret is unset the job FAILS (fork PRs excepted —
# secrets are unavailable there; the scan runs again on merge to main).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for private-boundary terms
        shell: bash
        env:
          BLOCKLIST: ${{ secrets.LAKERAVEN_BOUNDARY_BLOCKLIST }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${BLOCKLIST:-}" ]; then
            if [ "${IS_FORK_PR}" = "true" ]; then
              echo "::notice::Fork PR: secrets unavailable; boundary scan runs on merge."
              exit 0
            fi
            echo "::error::LAKERAVEN_BOUNDARY_BLOCKLIST is unset — the boundary guard is inert. Set the org secret."
            exit 1
          fi
          fail=0
          while IFS= read -r term; do
            term="${term%$'\r'}"
            if [ -z "$term" ]; then continue; fi
            esc="$(printf '%s' "$term" | sed -e 's/[][\.*^$(){}?+|/]/\\&/g')"
            pattern="(^|[^A-Za-z0-9])${esc}([^A-Za-z0-9]|$)"
            matches="$(grep -RInEi --exclude-dir=.git -e "$pattern" . | cut -d: -f1,2 || true)"
            if [ -n "$matches" ]; then
              while IFS= read -r loc; do
                if [ -z "$loc" ]; then continue; fi
                echo "::error::private-boundary term matched at ${loc}"
                fail=1
              done <<< "$matches"
            fi
            if printf '%s\n%s\n' "${PR_TITLE:-}" "${PR_BODY:-}" | grep -qEi -e "$pattern"; then
              echo "::error::private-boundary term matched in the PR title or body"
              fail=1
            fi
          done <<< "${BLOCKLIST}"
          if [ "$fail" -ne 0 ]; then
            echo "A private-boundary term was found in this public repo. Remove it before merging."
            exit 1
          fi
          echo "No private-boundary terms found."
