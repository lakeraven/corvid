name: CI
on: { pull_request: {}, push: { branches: [ main ] } }
jobs:
  ci:
    uses: lakeraven/.github/.github/workflows/rails-ci.yml@main
    secrets: inherit
    with:
      ruby_version: "4.0.6"
      test_cmd: "bundle exec rake test && bundle exec cucumber --tags \"not @wip\" --format progress"
      run_brakeman: false
